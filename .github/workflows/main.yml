name: Flight Monitor (Windows)

on:
  schedule:
    # 每天 4 次執行 (UTC 時間 0:00, 6:00, 12:00, 18:00)
    # 對應台灣時間：08:00, 14:00, 20:00, 02:00
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # 允許隨時手動點擊執行

# 💡 關鍵修正：加入 permissions 設定，允許下載跨次 Workflow 的 Artifacts
permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest  # 指定使用 Windows 雲端環境
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install chromium

      - name: Restore Previous History Artifacts
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true # 第一次執行若無歷史檔案則自動忽略錯誤繼續往下 run
        with:
          name: flight-data-history
          path: ./

      - name: Run Crawler
        run: python main.py

      - name: Upload Updated History Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flight-data-history
          path: |
            data/
            logs/
          retention-days: 90 # 歷史紀錄在 GitHub Artifact 上保留天數