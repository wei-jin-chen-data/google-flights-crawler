name: Flight Monitor (Windows)

on:
  schedule:
    # 每天 4 次執行 (UTC 時間 0:00, 6:00, 12:00, 18:00)
    # 對應台灣時間：08:00, 14:00, 20:00, 02:00
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # 允許隨時手動點擊執行

jobs:
  build:
    runs-on: windows-latest  # 指定使用 Windows 雲端環境
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run Crawler
        run: python main.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: flight-data-windows
          path: |
            data/
            logs/
            debug/