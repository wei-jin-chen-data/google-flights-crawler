name: Flight Monitor (Windows)

on:
  schedule:
    # 每天 1 次執行 (UTC 時間 0:00)
    # 對應台灣時間：08:00
    - cron: '0 0 * * *'
  workflow_dispatch: 

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install chromium

      - name: Restore Previous History Artifacts
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true 
        with:
          name: flight-data-history
          path: ./

      - name: Run Crawler
        run: python main.py

      - name: Upload Updated History Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flight-data-history
          path: |
            data/
            logs/
          retention-days: 90 